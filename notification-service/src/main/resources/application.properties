server.port=${PORT:8082}
spring.application.name=notification-service

# Local development: load GMAIL_USER / GMAIL_APP_PASSWORD from a .env file if present
spring.config.import=optional:file:.env[.properties]

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cors.allowed-origin=${CORS_ALLOW_ORIGIN:*}

app.jwt.secret=${JWT_SECRET:}
app.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8080}
app.rate-limit.per-hour=${NOTIFICATION_RATE_LIMIT_PER_HOUR:30}
